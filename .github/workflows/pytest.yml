name: Unit Tests
on: [push]

# A second push to the same branch makes the run that is in progress
# worthless, because it tests a commit that nobody will merge. Stop it, so
# that the two runs do not compete for the same runners. Every workflow in
# this repository keeps a group name of its own, thus one workflow never
# cancels the runs of another.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Pytest_bootstrapper:
    runs-on: ubuntu-latest
    # 0.2 to 0.3 minutes in the last three runs. The 10 minutes are for a
    # `uv sync` with no cache, not for the 8 tests.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup uv cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - name: Test with pytest
        run: uv run pytest
  Pytest:
    runs-on: ubuntu-latest
    # The heaviest job here: it renders the template, syncs the generated
    # project and runs the generated suite. 1.2 to 1.7 minutes in the last
    # three runs. 15 minutes, not the 20 that the generated project gets,
    # because the suite this job runs is the template's own and stays small,
    # where a real project's suite grows.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: my_project_test_db
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      matrix:
        fe_type: [react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup uv cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('my_project/server/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install bootstrapper dependencies
        run: uv sync
      - run: |
          config_file="cookiecutter/${{ matrix.fe_type }}_template.yaml"
          uv run cookiecutter . --config-file $config_file --no-input -f
      # ruff C901 does the complexity check now, thus the name no longer
      # speaks about McCabe.
      - name: Pytest and Coverage
        run: |
          cd my_project
          uv sync
          mkdir -p client/dist
          uv run python server/manage.py collectstatic
          # The same flags as the generated project's own CI and its justfile
          # `server-test` recipe. All three run the generated suite, thus all
          # three must run it the same way.
          uv run pytest --cov=my_project --cov-config=pyproject.toml -n auto --dist loadscope server/my_project
          uv run coverage report

      - name: Check migrations and migration conflicts
        run: |
          cd my_project
          uv run python server/manage.py makemigrations --check --dry-run
          uv run python server/manage.py makemigrations --merge --dry-run
