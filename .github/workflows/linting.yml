name: Linter
on: [push]

# Stop the run that is in progress when a second push comes to the same
# branch. See `pytest.yml` for why. The group name is this workflow's own.
concurrency:
  group: linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lock_Files:
    # The Heroku Python buildpack runs `uv sync --locked`, which refuses a lock
    # file that does not agree with its pyproject.toml. Catch that here instead
    # of in a failed deploy.
    runs-on: ubuntu-latest
    # 0.1 to 0.2 minutes in the last three runs. The 10 minutes cover two
    # `uv` resolutions and a render of the template, which all need the
    # network.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      # This check must come before `uv sync`, because a sync updates a stale
      # lock file and thus hides the problem.
      - name: Check bootstrapper lock file
        run: uv lock --check
      - name: Install dependencies
        run: uv sync
      - run: |
          uv run cookiecutter . --config-file cookiecutter/react_template.yaml --no-input -f
      - name: Check generated project lock file
        working-directory: ./my_project
        run: uv lock --check

  Ruff_bootstrapper:
    runs-on: ubuntu-latest
    # ruff on this repository alone, with no render before it. 0.2 minutes
    # in the last three runs, thus 5 minutes is only a stop for a hang.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup uv cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - name: Run Ruff Lint Check
        run: uv run ruff check .
      - name: Run Ruff Format Check
        run: uv run ruff format --check . -q
  Ruff:
    strategy:
      matrix:
        fe_type: [react]
    runs-on: ubuntu-latest
    # More than `Ruff_bootstrapper`, because this job does a `uv sync` and a
    # full render before it lints. 0.2 to 0.3 minutes in the last three runs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup uv cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - run: |
          config_file="cookiecutter/${{ matrix.fe_type }}_template.yaml"
          uv run cookiecutter . --config-file $config_file --no-input -f
      - name: Run Ruff Lint Check
        run: uv run ruff check --output-format=github my_project/server
      - name: Run Ruff Format Check
        run: uv run ruff format --check my_project/server -q
  Lint_Web:
    strategy:
      matrix:
        fe_type: [react]
    runs-on: ubuntu-latest
    # `npm install` gets a whole dependency tree from the network, and a slow
    # registry is not a hang. 0.5 to 0.6 minutes in the last three runs.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup uv cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - run: |
          config_file="cookiecutter/${{ matrix.fe_type }}_template.yaml"
          uv run cookiecutter . --config-file $config_file --no-input -f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 📦 Install dependencies
        env:
          NPM_CONFIG_PRODUCTION: false
        working-directory: ./my_project/client
        run: |
          npm install
      - name: 🆎 TypeCheck
        working-directory: ./my_project/client
        run: npm run tslint
      - name: 🚧 ESLint
        working-directory: ./my_project/client
        run: npm run eslint
  Lint_Mobile:
    runs-on: ubuntu-latest
    # The same as `Lint_Web`, and for the same reason. The mobile dependency
    # tree is the larger of the two: 0.8 to 0.9 minutes in the last three runs.
    timeout-minutes: 15
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Setup uv cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: uv sync
      - run: |
          config_file="cookiecutter/rn_template.yaml"
          uv run cookiecutter . --config-file $config_file --no-input -f
      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: 📦 Install dependencies
        working-directory: ./my_project/mobile
        run: npm install
      - name: 🆎 TypeCheck
        working-directory: ./my_project/mobile
        run: npm run lint:tslint
      - name: 🚧 ESLint
        working-directory: ./my_project/mobile
        run: npm run lint:eslint
