[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.42.*",
    "pydantic-ai>=2.24.0",
    "channels==4.2.*",
    "channels-redis==4.2",
    "daphne>=4.2.2",
    "dj-database-url==0.5.0",
    "dj-rest-auth==7.0.*",
    "django>=5.2.14",
    "django-anymail==13.0.*",
    "django-cors-headers==3.8.0",
    "django-currentuser>=0.9.0",
    "django-extensions==3.2.*",
    "django-filter>=24.2",
    "django-storages==1.11.1",
    "django4-background-tasks>=1.2.10",
    "djangorestframework==3.17.*",
    "drf-nested-routers==0.93.3",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "premailer>=3.10.0",
    "psycopg2-binary==2.9.*",
    "python-decouple>=3.8",
    "requests>=2.33.0",
    "rollbar>=1.2.0",
    "whitenoise==5.3.0",
]

[dependency-groups]
# The Heroku Python buildpack installs with `uv sync --locked --no-default-groups`,
# so this group stays off production dynos. CI and local `uv sync` include it.
dev = [
    "debugpy>=1.8.0",
    "ruff==0.16.0",
    "pre-commit==4.5.*",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.8.0",
    "pytest-factoryboy>=2.8.0",
    "pytest-xdist>=3.6.0",
    "factory-boy==3.2.*",
]

[tool.ruff]
line-length = 100
exclude = [
    "**/migrations/*"
]


[tool.ruff.lint]
extend-select = ["I", "C90"]
# Ruff 0.16.0 enables 413 rules by default. RUF012 flags Django/DRF framework
# idioms (Meta.fields, admin list_filter, model REQUIRED_FIELDS, serializer
# read_only_fields) as mutable class defaults. These are framework conventions,
# not bugs, so silence the rule rather than annotate every attribute ClassVar.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
# Name the project package, instead of a reliance on the same-package detection.
# That detection needs an `__init__.py` beside the file it sorts, and a test
# directory has none, so a test module that imports the project would sort that
# import into the third-party block. Its correct place in that block depends on
# where the project name falls alphabetically, so the same file would pass or fail
# the lint by the project name alone.
known-first-party = ["{{ cookiecutter.project_slug }}"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.coverage.report]
fail_under = 60

[tool.uv]
# Floors for transitive packages, set by past security fixes. A constraint only
# applies when some other package requires the name, so a dropped dependency
# chain does not keep an unused package installed.
constraint-dependencies = [
    "urllib3>=2.7.0",
    "pyasn1>=0.6.4",
    "pyopenssl>=26.0.0",
    "pyjwt>=2.13.0",
    "ujson>=5.13.0",
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "virtualenv>=20.36.1",
    "filelock>=3.20.3",
    "cbor2>=5.9.0",
    "PyNaCl>=1.6.2",
    "twisted>=26.4.0",
    "lxml>=6.1.0",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "sqlparse>=0.6.0",
]
