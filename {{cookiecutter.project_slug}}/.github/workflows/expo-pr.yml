name: Expo Publish PR
# One preview publish per environment at a time: a newer deploy cancels the older run.
# github.event.number is empty on deployment_status, so key on the deployment environment.
# State is part of the key so pending/inactive statuses for the same environment
# (GitHub marks the previous deployment inactive) can't cancel the running publish.
concurrency:
  {% raw %}
  group: expo-pr-${{ github.event.deployment.environment }}-${{ github.event.deployment_status.state }}
  {% endraw %}
  cancel-in-progress: true

on: [deployment_status]
jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: jwalton/gh-find-current-pr@master
        id: findPr
      - name: Set name for PR
        if: success() && steps.findPr.outputs.number
        run: echo "PR=pr-${PR}" >> $GITHUB_ENV
        env:
          PR: {{ "${{ steps.findPr.outputs.pr }}" }}
    outputs:
      PR: {{ "${{ env.PR }}" }}

  publish:
    # Only successful PR environment deploys (pr-<n>). Staging/production deploys also
    # emit deployment_status and would otherwise publish a bogus PR preview.
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'pr-')
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: "**/node_modules"
          key: {{ "${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}" }}

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: {{ "${{ secrets.EXPO_TOKEN }}" }}

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: 🚀 Publish preview
        run: |
          cd mobile && eas update --branch={{ "${{ needs.setup.outputs.PR }}" }} --non-interactive --auto
          echo "{{ "${{ env.EXPO_PUBLIC_BACKEND_SERVER_URL }}" }} and {{ "${{ needs.setup.outputs.PR }}" }}"
        env:
          EXPO_PUBLIC_BACKEND_SERVER_URL: {{ "${{ github.event.deployment_status.environment_url }}" }}
          EXPO_PUBLIC_ROLLBAR_ACCESS_TOKEN: ""
