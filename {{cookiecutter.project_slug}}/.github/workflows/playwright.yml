name: Playwright Tests
# `pytest.yml`, `linting.yml` and `specs.yml` cancel the run that is in
# progress for the same branch. This workflow does not, because it has no
# branch to key that on: GitHub documents `github.ref` as empty for a
# `deployment_status` event that came from a commit SHA. An empty value puts
# every deployment in one group, thus a deployment of one environment would
# cancel the tests of another. To add it, key the group on the environment,
# for example `github.event.deployment_status.environment_url`, and test it
# with two deployments that overlap.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against'
        required: false
        default: ''
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    if: github.event.deployment_status.state == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          # For deployment_status events, we need to explicitly checkout the deployment's ref
          ref: {{ "${{ github.event.deployment.sha || github.ref }}" }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json
      - name: Install dependencies
        working-directory: ./client
        run: npm ci
      # Browsers are pre-installed in the Playwright Docker image
      # No need to install them again!
      - name: Create .env file for Playwright
        working-directory: ./client
        run: |
          echo "PLAYWRIGHT_TEST_USER_PASS={{ "${{ secrets.PLAYWRIGHT_TEST_USER_PASS }}" }}" > .env
      - name: Run Playwright tests
        working-directory: ./client
        run: npx playwright test --reporter=html
        env:
          HOME: /root  # Required for Firefox to run in the container
          PLAYWRIGHT_TEST_BASE_URL: {{ "${{ github.event.deployment_status.environment_url || github.event.inputs.base_url }}" }}
          PLAYWRIGHT_TEST_USER_PASS: {{ "${{ secrets.PLAYWRIGHT_TEST_USER_PASS }}" }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ./client/playwright-report/
          retention-days: 30
