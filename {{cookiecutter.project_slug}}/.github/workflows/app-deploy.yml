{% raw %}name: Deploy Application

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  # Teardown is in pr-environment-cleanup.yml (pull_request_target).
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - teardown
      environment:
        description: 'Environment to deploy to or tear down'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
      tag:
        description: 'Required for production: version tag to deploy (e.g. v1.2.0)'
        required: false
        type: string
      pr_number:
        description: 'Teardown only: PR number to tear down (targets pr-<number>, overrides Environment)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write
  deployments: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    concurrency:
      group: build-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || (github.event_name == 'pull_request' && format('pr-{0}', github.event.number)) || github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'staging') || 'dev' }}
      cancel-in-progress: true
    outputs:
      environment: ${{ steps.setup-env.outputs.environment }}
      image_tag: ${{ steps.setup-env.outputs.image_tag }}
      ecr_registry: ${{ steps.setup-env.outputs.ecr_registry }}
      account_id: ${{ steps.setup-env.outputs.account_id }}
      role_arn: ${{ steps.setup-env.outputs.role_arn }}
      aws_region: ${{ steps.setup-env.outputs.aws_region }}
      base_domain: ${{ steps.setup-env.outputs.base_domain }}
      use_custom_domain: ${{ steps.setup-env.outputs.use_custom_domain }}
      custom_domain: ${{ steps.setup-env.outputs.custom_domain }}
      route53_zone_id: ${{ steps.setup-env.outputs.route53_zone_id }}
      certificate_arn: ${{ steps.setup-env.outputs.certificate_arn }}
    steps:
      - name: Validate production requires a tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::Production deployments require a version tag (e.g. v1.2.0)"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "::error::Tag must start with 'v' (e.g. v1.2.0)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup-env
        uses: ./.github/actions/setup-environment
        with:
          manual_environment: ${{ github.event.inputs.environment }}
          manual_tag: ${{ github.event.inputs.tag }}
          aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Setup AWS
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        uses: ./.github/actions/setup-aws
        with:
          account_id: ${{ steps.setup-env.outputs.account_id }}
          role_arn: ${{ steps.setup-env.outputs.role_arn }}
          aws_region: ${{ env.AWS_REGION }}
          ecr_repository_name: ${{ vars.ECR_REPOSITORY_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}-app' }}

      - name: Login to Amazon ECR
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: !(github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./compose/server/tf/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.setup-env.outputs.ecr_registry }}/${{ vars.ECR_REPOSITORY_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}-app' }}:${{ steps.setup-env.outputs.image_tag }}
            ${{ steps.setup-env.outputs.ecr_registry }}/${{ vars.ECR_REPOSITORY_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}-app' }}:${{ steps.setup-env.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.build.outputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS
        uses: ./.github/actions/setup-aws
        with:
          account_id: ${{ needs.build.outputs.account_id }}
          role_arn: ${{ needs.build.outputs.role_arn }}
          aws_region: ${{ env.AWS_REGION }}
          ecr_repository_name: ${{ vars.ECR_REPOSITORY_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}-app' }}

      - name: Create GitHub Deployment
        id: deployment
        run: |
          echo "Creating deployment for environment: ${{ needs.build.outputs.environment }}"

          DEPLOYMENT_ID=$(echo '{"ref":"${{ github.sha }}","environment":"${{ needs.build.outputs.environment }}","description":"Deploy to ${{ needs.build.outputs.environment }}","auto_merge":false,"required_contexts":[]}' \
            | gh api repos/${{ github.repository }}/deployments --method POST --input - --jq '.id')

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ needs.build.outputs.environment }}
          service_name: ${{ vars.SERVICE_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}' }}

      - name: Generate Terraform Variables
        uses: ./.github/actions/generate-terraform-vars
        with:
          environment: ${{ needs.build.outputs.environment }}
          aws_region: ${{ needs.build.outputs.aws_region }}
          base_domain: ${{ needs.build.outputs.base_domain }}
          use_custom_domain: ${{ needs.build.outputs.use_custom_domain }}
          custom_domain: ${{ needs.build.outputs.custom_domain }}
          route53_zone_id: ${{ needs.build.outputs.route53_zone_id }}
          certificate_arn: ${{ needs.build.outputs.certificate_arn }}
          service_name: ${{ vars.SERVICE_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}' }}
          ecr_repository_name: ${{ vars.ECR_REPOSITORY_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}-app' }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          terraform plan -input=false -out=tfplan
          echo "has_changes=$( [ -s tfplan ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        if: steps.plan.outputs.has_changes == 'true'
        run: |
          cd terraform
          terraform apply -input=false tfplan

      - name: Seed test data
        if: github.event_name == 'pull_request'
        run: |
          cd terraform
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASK_DEF=$(terraform output -raw app_task_definition_arn)
          CONTAINER=$(terraform output -raw app_container_name)
          SUBNETS=$(terraform output -json ecs_subnets | jq -r 'join(",")')
          SGS=$(terraform output -json ecs_security_groups | jq -r 'join(",")')

          TG_ARN=$(terraform output -raw app_target_group_arn)

          echo "Waiting for ALB health check (entrypoint runs migrate before gunicorn)..."
          ELAPSED=0
          while [ $ELAPSED -lt 300 ]; do
            HEALTH=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text 2>/dev/null || echo "none")
            if [ "$HEALTH" = "healthy" ]; then
              echo "Target healthy after ${ELAPSED}s"
              break
            fi
            echo "  target state: $HEALTH (${ELAPSED}s)"
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          if [ "$HEALTH" != "healthy" ]; then
            echo "::warning::Target not healthy after 300s — seeding anyway"
          fi

          echo "Running create_test_data as one-off ECS task..."
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER\",\"command\":[\"python\",\"manage.py\",\"create_test_data\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Waiting for task to complete: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::warning::create_test_data exited with code $EXIT_CODE"
          else
            echo "✅ Test data seeded successfully"
          fi

      - name: Get Application URL
        id: app-url
        run: |
          cd terraform
          APP_URL=$(terraform output -raw application_url 2>/dev/null || true)
          # Strip any Terraform warning text that isn't a URL
          [[ "$APP_URL" != http* ]] && APP_URL=""
          if [[ -n "$APP_URL" ]]; then
            echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
            echo "✅ Application URL: $APP_URL"
          fi

      - name: Add or Update PR Comment
        if: github.event_name == 'pull_request'
        run: |
          APP_URL="${{ steps.app-url.outputs.app_url }}"
          COMMENT_BODY="🚀 **Deployment Preview**

          **Environment:** \`${{ needs.build.outputs.environment }}\`
          **Application URL:** ${APP_URL:-_URL will be available after infrastructure deployment_}

          The environment will be automatically updated with each new commit to this PR."

          # Find existing deployment preview comment and update it, or create a new one
          EXISTING_COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments \
            --jq '.[] | select(.body | contains("Deployment Preview")) | .id' | head -1)

          if [[ -n "$EXISTING_COMMENT_ID" ]]; then
            gh api repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT_ID \
              --method PATCH --field body="$COMMENT_BODY"
          else
            gh pr comment ${{ github.event.number }} --body "$COMMENT_BODY"
          fi

      - name: Update deployment status
        if: always() && steps.deployment.outputs.deployment_id
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            DEPLOYMENT_STATE="success"
            DESCRIPTION="Deployment completed successfully"
          else
            DEPLOYMENT_STATE="failure"
            DESCRIPTION="Deployment failed"
          fi

          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses \
            --method POST \
            --field state="$DEPLOYMENT_STATE" \
            --field description="$DESCRIPTION" \
            --field environment_url="${{ steps.app-url.outputs.app_url }}" \
            --field auto_inactive=true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  teardown-environment:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'teardown'
    runs-on: ubuntu-latest
    # pr_number wins when set, so a review app whose cleanup was missed can be torn
    # down from the Actions UI. Without it there is no manual path to a pr-* env:
    # the Environment input only offers dev / staging.
    environment: ${{ github.event.inputs.pr_number != '' && format('pr-{0}', github.event.inputs.pr_number) || github.event.inputs.environment }}
    # Own group — shared group with deploy caused teardowns to queue behind deploys.
    concurrency:
      group: teardown-${{ github.event.inputs.pr_number != '' && format('pr-{0}', github.event.inputs.pr_number) || github.event.inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup-env
        uses: ./.github/actions/setup-environment
        with:
          manual_environment: ${{ github.event.inputs.pr_number != '' && format('pr-{0}', github.event.inputs.pr_number) || github.event.inputs.environment }}
          aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}


      - name: Setup AWS
        uses: ./.github/actions/setup-aws
        with:
          account_id: ${{ steps.setup-env.outputs.account_id }}
          role_arn: ${{ steps.setup-env.outputs.role_arn }}
          aws_region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          environment: ${{ steps.setup-env.outputs.environment }}
          service_name: ${{ vars.SERVICE_NAME || '{% endraw %}{{cookiecutter._sanitized_tf_service_name}}{% raw %}' }}

      - name: Confirm and Destroy Environment
        run: |
          set -euo pipefail
          cd terraform
          ENVIRONMENT="${{ steps.setup-env.outputs.environment }}"

          # Isolation is by state key, not workspace.
          if ! RESOURCES="$(terraform state list)"; then
            echo "❌ Could not read Terraform state for $ENVIRONMENT."
            exit 1
          fi

          if [ -z "$RESOURCES" ]; then
            echo "ℹ️  No Terraform state for $ENVIRONMENT — nothing to destroy."
            exit 0
          fi

          echo "🗑️ Destroying infrastructure for environment: $ENVIRONMENT"
          echo "⚠️  This will permanently delete all resources in the $ENVIRONMENT environment"

          # route53_zone_id + base_domain: without them the CNAME count is 0
          # and Route53 records are silently skipped from the destroy plan.
          EXTRA_VARS=(
            -var="aws_profile="
            -var="skip_ecr_image_lookup=true"
            -var="environment=$ENVIRONMENT"
            -var="route53_zone_id=${{ steps.setup-env.outputs.route53_zone_id }}"
            -var="base_domain=${{ steps.setup-env.outputs.base_domain }}"
          )
          PLAN_ARGS=(-destroy -input=false "${EXTRA_VARS[@]}" -detailed-exitcode -out=destroy.tfplan)

          # Break stale locks; capture output so non-lock errors are visible.
          PROBE_OUTPUT=$(terraform plan -destroy -input=false "${EXTRA_VARS[@]}" 2>&1) || true
          LOCK_ID=$(echo "$PROBE_OUTPUT" | grep -oP 'ID:\s+\K[0-9a-f-]+' | head -1 || true)
          if [[ -n "$LOCK_ID" ]]; then
            echo "🔓 Stale lock detected ($LOCK_ID), force-unlocking..."
            if ! terraform force-unlock -force "$LOCK_ID"; then
              echo "⚠️  force-unlock failed — proceeding, plan will fail if lock is still held"
            fi
          elif echo "$PROBE_OUTPUT" | grep -qi "error"; then
            echo "⚠️  Lock probe hit non-lock errors:"
            echo "$PROBE_OUTPUT" | tail -20
          fi

          echo "🔍 Validating destroy plan..."
          PLAN_EC=0
          terraform plan "${PLAN_ARGS[@]}" || PLAN_EC=$?

          if [ $PLAN_EC -eq 1 ]; then
            echo "❌ Destroy plan failed — check variable definitions and state"
            exit 1
          elif [ $PLAN_EC -eq 0 ]; then
            echo "❌ State contains resources but plan shows nothing to destroy — likely a variable mismatch"
            exit 1
          fi
          # exit code 2 = plan succeeded, changes present

          if terraform apply destroy.tfplan; then
            echo "✅ Successfully destroyed infrastructure for environment: $ENVIRONMENT"
          else
            echo "❌ Failed to destroy infrastructure for environment: $ENVIRONMENT"
            exit 1
          fi{% endraw %}
