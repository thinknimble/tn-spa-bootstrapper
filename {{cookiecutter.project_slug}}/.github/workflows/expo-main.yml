name: Expo Publish Main
# Rapid merges: only the latest main commit builds; the older run is cancelled
# (and its EAS build is cancelled below, since GitHub cancellation doesn't reach EAS).
concurrency:
  group: expo-main
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
        BUILD_MOBILE_APP: {{ "${{ steps.checkdiff.outputs.BUILD_MOBILE_APP }}" }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        name: check diff
      - id: checkdiff
        # Diff the whole push (before..after), not just the head commit.
        run: |
          {% raw %}BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "This workflow was triggered by a workflow_dispatch event."
            echo "BUILD_MOBILE_APP=1" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable base commit; building."
            echo "BUILD_MOBILE_APP=1" >> "$GITHUB_OUTPUT"
          else
            echo "BUILD_MOBILE_APP=$(git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -c '^mobile/' || true)" >> "$GITHUB_OUTPUT"
          fi{% endraw %}

  printouts:
    runs-on: ubuntu-24.04
    needs: setup
    steps:
      - name: Echo files
        run: |
          echo "{{ "${{ needs.setup.outputs.BUILD_MOBILE_APP}}" }}"
          echo "$([[ needs.setup.outputs.BUILD_MOBILE_APP != 0 ]] && echo 'Changes detected in mobile dir..' || 'No changes in mobile app detected... will not deploy to expo')"
  publish:
    needs: setup
    runs-on: ubuntu-24.04
    if: needs.setup.outputs.BUILD_MOBILE_APP != 0
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ./mobile/package-lock.json

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: {{ "${{ secrets.EXPO_TOKEN }}" }}

      - name: 🏗 Get Hash
        id: GIT_HASH
        run: echo "GIT_HASH=$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV

      - name: 📦 Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: 🛑 Cancel superseded staging EAS builds
        working-directory: ./mobile
        run: ../.github/scripts/eas-cancel-stale-builds.sh staging all

      - name: 🚀 Build app
        run: cd mobile && eas build --platform all --profile staging --non-interactive
        env:
          SENTRY_PROJECT_NAME: "<REPLACE_WTIH_SENTRY_PROJECT_NAME>"

      - name: 🚀 Publish Staging Preview
        run: cd mobile && eas update --branch=staging --non-interactive --auto
        env:
         # Since expo update replaces code OTA these variables should match the staging variables in eas.json
          EXPO_PUBLIC_BACKEND_SERVER_URL: ""
          EXPO_PUBLIC_ROLLBAR_ACCESS_TOKEN: ""
